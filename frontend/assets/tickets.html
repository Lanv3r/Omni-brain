<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review and filter open support tickets in OmniCommand">
  <title>Tickets | OmniCommand</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f6;
      --panel: #ffffff;
      --panel-raised: #f5f5f5;
      --line: #dedede;
      --text: #333333;
      --muted: #666666;
      --accent: #ffa500;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }

    a { color: inherit; }
    a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .shell { width: min(1160px, 100% - 40px); margin-inline: auto; }

    header {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 75px;
      padding-block: 14px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      flex: 0 0 auto;
      text-decoration: none;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.04em;
    }

    .mark {
      display: block;
      flex: 0 0 auto;
    }
    .mark img { display: block; width: auto; height: 48px; object-fit: contain; }

    .section-nav { border-top: 1px solid var(--line); background: #fafafa; }
    .section-nav-inner { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .section-nav a { padding: 12px 8px; color: var(--muted); font-size: 14px; font-weight: 650; text-align: center; text-decoration: none; }
    .section-nav a:hover, .section-nav a[aria-current="page"] { background: #fff3dc; color: var(--text); }
    .section-nav a[aria-current="page"] { box-shadow: inset 0 -2px var(--accent); }
    .partner-brand { display: block; width: auto; height: 48px; max-width: min(160px, 35vw); object-fit: contain; }

    main { padding-block: clamp(36px, 6vw, 64px) 72px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 48px); line-height: 1.08; letter-spacing: -.05em; }
    .result-count { margin: 0; color: var(--muted); font-size: 13px; }

    .ticket-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #fafafa;
    }

    .field { display: grid; gap: 6px; }
    .search-field { flex: 1 1 250px; }
    .filter-field { flex: 0 1 170px; }
    .multi-dropdown { position: relative; width: 100%; }
    .multi-dropdown summary {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      list-style: none;
    }
    .multi-dropdown summary::-webkit-details-marker { display: none; }
    .multi-dropdown summary::after { color: var(--muted); content: "▾"; }
    .multi-dropdown[open] summary { border-color: var(--accent); }
    .multi-options {
      position: absolute;
      z-index: 2;
      top: calc(100% + 6px);
      left: 0;
      display: grid;
      min-width: 100%;
      max-height: 300px;
      overflow-y: auto;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-raised);
      box-shadow: 0 12px 28px rgb(0 0 0 / 28%);
    }
    .multi-option { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
    .multi-option input[type="checkbox"] { width: 15px; min-height: 15px; height: 15px; margin: 0; padding: 0; accent-color: var(--accent); }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input, select {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
    }

    input::placeholder { color: #777777; }

    .table-scroll { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      white-space: nowrap;
    }

    th, td { padding: 15px 16px; border-bottom: 1px solid var(--line); }

    th {
      background: #f5f5f5;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    td { font-size: 13px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fff8eb; }

    .ticket-id { color: var(--accent); font-weight: 650; }
    .subject { color: var(--text); font-weight: 600; }
    .secondary { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
    }

    .pill::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .status-open { border-color: #e2bd65; background: #fff9e9; color: #765000; }
    .status-progress { border-color: #a7c7e9; background: #eff6fd; color: #245b8e; }
    .status-resolved { border-color: #a7d2b7; background: #eff8f2; color: #24633d; }
    .status-closed { border-color: var(--line); background: #f5f5f5; color: var(--muted); }
    .priority-high { border-color: #e8c47e; background: #fff5df; color: #875000; }
    .priority-urgent { border-color: #e8a39f; background: #fff0ef; color: #a32922; }
    .priority-normal { color: #765000; }
    .priority-low { color: #666666; }

    .empty-state {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
      white-space: normal;
    }

    .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 14px; }
    .pagination button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
    .pagination button:disabled { opacity: .5; cursor: default; }

    @media (max-width: 560px) {
      .shell { width: min(100% - 32px, 1160px); }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 8px; }
      .toolbar { align-items: stretch; }
      .search-field, .filter-field { flex-basis: 100%; }
      th, td { padding-inline: 12px; }
      .section-nav-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
  <link rel="stylesheet" href="theme.css?v=9">
  <script src="theme.js?v=4"></script>
</head>
<body>
  <header>
    <div class="bar shell">
      <a class="brand" href="index.html" aria-label="OmniCommand home">
        <span class="mark" aria-hidden="true"><img src="assets/omnitechpro-fireball-transparent.png" width="128" height="163" alt=""></span>
        <span>OmniCommand</span>
      </a>
      <div class="current-employee"><select id="current-employee" aria-label="Current employee"><option value="">Loading employees...</option></select></div>
      <script src="assets/current_user.js?v=4"></script>
      <div class="theme-menu">
        <button class="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose color theme">
          <span class="theme-icon-wrap" aria-hidden="true"><svg class="theme-icon theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-icon theme-moon" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path></svg></span>
          <span class="theme-current theme-light-label">Light mode</span><span class="theme-current theme-dark-label">Dark mode</span>
          <svg class="theme-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div class="theme-options" hidden><button class="theme-option" type="button">
          <span class="theme-option-icon" aria-hidden="true"><svg class="theme-icon theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-icon theme-moon" viewBox="0 0 24 24"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path></svg></span>
          <span class="theme-option-label theme-dark-label">Dark mode</span><span class="theme-option-label theme-light-label">Light mode</span>
        </button></div>
      </div>
      <img class="partner-brand" src="assets/omnitechpro-logo.png" width="355" height="163" alt="OmniTechPro">
    </div>
    <nav class="section-nav" aria-label="Main navigation">
      <div class="section-nav-inner shell">
        <a href="index.html">Dashboard</a>
        <a href="tickets.html" aria-current="page">Tickets</a>
        <a href="tasks.html">Tasks</a>
        <a href="my_assignments.html">My Assignments</a>
        <a href="process_plans.html">Process plans</a>
        <a href="alerts.html">Alerts</a>
        <a href="device_monitoring.html">Device monitoring</a>
        <a class="ai-tab" href="ai_assistant.html"><img class="ai-tab-icon" src="assets/ai-icon.jpeg" width="20" height="20" alt="">AI Assistant</a>
      </div>
    </nav>
  </header>

  <main class="shell">
    <section aria-labelledby="page-title">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Accelo</p>
          <h1 id="page-title">Tickets</h1>
        </div>
        <p class="result-count" id="result-count" aria-live="polite">Loading tickets...</p>
      </div>
      <div class="ticket-panel">
        <form class="toolbar" role="search" onsubmit="return false">
          <div class="field search-field">
            <label for="ticket-search">Search tickets</label>
            <input id="ticket-search" type="search" placeholder="Search title or description">
          </div>
          <div class="field filter-field">
            <label for="company-filter">Company</label>
            <select id="company-filter">
              <option value="all">All</option>
            </select>
          </div>
          <div class="field filter-field">
            <label id="status-label">Status</label>
            <details class="multi-dropdown status-dropdown">
              <summary aria-labelledby="status-label status-selection"><span id="status-selection">2 selected</span></summary>
              <div class="multi-options">
                <label class="multi-option"><input type="checkbox" name="status" value="open" checked> Open</label>
                <label class="multi-option"><input type="checkbox" name="status" value="inprogress" checked> In progress</label>
                <label class="multi-option"><input type="checkbox" name="status" value="resolved"> Resolved</label>
                <label class="multi-option"><input type="checkbox" name="status" value="closed"> Closed</label>
              </div>
            </details>
          </div>
          <div class="field filter-field">
            <label id="priority-label">Priority</label>
            <details class="multi-dropdown priority-dropdown">
              <summary aria-labelledby="priority-label priority-selection"><span id="priority-selection">All</span></summary>
              <div class="multi-options">
                <label class="multi-option"><input type="checkbox" name="priority" value="urgent"> Urgent</label>
                <label class="multi-option"><input type="checkbox" name="priority" value="high"> High</label>
                <label class="multi-option"><input type="checkbox" name="priority" value="normal"> Normal</label>
                <label class="multi-option"><input type="checkbox" name="priority" value="low"> Low</label>
              </div>
            </details>
          </div>
          <div class="field filter-field">
            <label id="assignee-label">Assignee</label>
            <details class="multi-dropdown assignee-dropdown">
              <summary aria-labelledby="assignee-label assignee-selection"><span id="assignee-selection">All</span></summary>
              <div class="multi-options" id="assignee-options"></div>
            </details>
          </div>
        </form>

        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">Ticket</th>
                <th scope="col">Requester</th>
                <th scope="col">Status</th>
                <th scope="col">Priority</th>
                <th scope="col">Assignee</th>
                <th scope="col">Submitted</th>
              </tr>
            </thead>
            <tbody id="ticket-rows">
              <tr><td class="empty-state" colspan="6">Loading tickets...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <nav class="pagination" aria-label="Ticket pages">
        <button type="button" id="previous-page" disabled>Previous</button>
        <span id="page-label" aria-live="polite">Page 1</span>
        <button type="button" id="next-page" disabled>Next</button>
      </nav>
    </section>
  </main>

  <script>
    const searchInput = document.getElementById("ticket-search");
    const companyFilter = document.getElementById("company-filter");
    const statusDropdown = document.querySelector(".status-dropdown");
    const statusFilters = [...document.querySelectorAll('input[name="status"]')];
    const statusSelection = document.getElementById("status-selection");
    const priorityDropdown = document.querySelector(".priority-dropdown");
    const priorityFilters = [...document.querySelectorAll('input[name="priority"]')];
    const prioritySelection = document.getElementById("priority-selection");
    const assigneeDropdown = document.querySelector(".assignee-dropdown");
    const assigneeOptions = document.getElementById("assignee-options");
    const assigneeSelection = document.getElementById("assignee-selection");
    const ticketRowsContainer = document.getElementById("ticket-rows");
    const resultCount = document.getElementById("result-count");
    const previousPage = document.getElementById("previous-page");
    const nextPage = document.getElementById("next-page");
    const pageLabel = document.getElementById("page-label");
    const searchParams = new URLSearchParams(window.location.search);
    const companyNames = new Map();
    const statusLabels = { open: "Open", inprogress: "In progress", resolved: "Resolved", closed: "Closed" };
    const statusClasses = { open: "status-open", inprogress: "status-progress", resolved: "status-resolved", closed: "status-closed" };
    let currentPage = 0;
    let requestId = 0;
    let searchTimer;
    let assigneeFilter;

    function element(tag, value, className) {
      const item = document.createElement(tag);
      item.textContent = value == null || value === "" ? "—" : String(value);
      if (className) item.className = className;
      return item;
    }

    function cell(...children) {
      const item = document.createElement("td");
      item.append(...children);
      return item;
    }

    function showMessage(message) {
      const row = document.createElement("tr");
      const item = element("td", message, "empty-state");
      item.colSpan = 6;
      row.append(item);
      ticketRowsContainer.replaceChildren(row);
    }

    function renderTickets(tickets) {
      if (!tickets.length) {
        showMessage("No matching tickets");
        return;
      }

      const rows = tickets.map(ticket => {
        const status = String(ticket.status || "").toLowerCase();
        const priority = String(ticket.priority || "").toLowerCase();
        const submitted = ticket.date_submitted ? new Date(ticket.date_submitted) : null;
        const submittedText = submitted && !Number.isNaN(submitted.getTime())
          ? submitted.toLocaleString()
          : "—";
        const row = document.createElement("tr");
        row.dataset.companyId = ticket.company_id;
        row.append(
          cell(element("span", "#" + ticket.id, "ticket-id"), element("span", ticket.title, "secondary subject")),
          cell(element("span", ticket.contact_name), element("span", companyNames.get(Number(ticket.company_id)), "secondary")),
          cell(element("span", statusLabels[status] || ticket.status, "pill " + (statusClasses[status] || ""))),
          cell(element("span", priority ? priority[0].toUpperCase() + priority.slice(1) : "—", "pill priority-" + priority)),
          cell(element("span", ticket.assignee_name || "Unassigned")),
          cell(element("span", submittedText))
        );
        return row;
      });
      ticketRowsContainer.replaceChildren(...rows);
    }

    function updatePrioritySelection() {
      const count = priorityFilters.filter(filter => filter.checked).length;
      prioritySelection.textContent = count ? count + " selected" : "All";
    }

    function updateStatusSelection() {
      const selected = statusFilters.filter(filter => filter.checked);
      statusSelection.textContent = selected.length === 0 ? "All"
        : selected.length === 1 ? selected[0].parentElement.textContent.trim()
          : selected.length + " selected";
    }

    async function loadTickets() {
      const thisRequest = ++requestId;
      const params = new URLSearchParams({ page: String(currentPage) });
      if (companyFilter.value !== "all") params.set("company_id", companyFilter.value);
      const statuses = statusFilters.filter(filter => filter.checked).map(filter => filter.value);
      if (statuses.length) params.set("status", statuses.join(","));
      const priorities = priorityFilters.filter(filter => filter.checked).map(filter => filter.value);
      if (priorities.length) params.set("priority", priorities.join(","));
      const assignees = assigneeFilter?.values() || [];
      if (assignees.length) params.set("assignees", assignees.join(","));
      if (searchInput.value.trim()) params.set("q", searchInput.value.trim());

      resultCount.textContent = "Loading tickets...";
      showMessage("Loading tickets...");
      previousPage.disabled = true;
      nextPage.disabled = true;
      pageLabel.textContent = "Page " + (currentPage + 1);

      try {
        const response = await fetch("http://127.0.0.1:8000/tickets?" + params);
        if (!response.ok) throw new Error("Could not load tickets (HTTP " + response.status + ")");
        const data = await response.json();
        if (thisRequest !== requestId) return;
        renderTickets(data.tickets);
        const totalPages = Math.max(1, Math.ceil(data.total / 10));
        const first = data.total ? currentPage * 10 + 1 : 0;
        const last = data.total ? Math.min(currentPage * 10 + data.tickets.length, data.total) : 0;
        resultCount.textContent = "Showing " + first + "–" + last + " of " + data.total + " tickets";
        pageLabel.textContent = "Page " + (currentPage + 1) + " of " + totalPages;
        previousPage.disabled = currentPage === 0;
        nextPage.disabled = currentPage + 1 >= totalPages;
      } catch (error) {
        if (thisRequest !== requestId) return;
        showMessage(error.message);
        resultCount.textContent = "Could not load tickets";
        previousPage.disabled = currentPage === 0;
      }
    }

    async function loadCompanyOptions() {
      try {
        const response = await fetch("http://127.0.0.1:8000/companies");
        if (!response.ok) throw new Error(await response.text());
        const companies = await response.json();
        for (const company of companies) companyNames.set(Number(company.id), company.name);
        companyFilter.replaceChildren(
          new Option("All", "all"),
          ...companies.map(company => new Option(company.name, String(company.id)))
        );
        const requestedCompany = searchParams.get("company_id");
        if (requestedCompany && [...companyFilter.options].some(option => option.value === requestedCompany)) {
          companyFilter.value = requestedCompany;
          loadTickets();
        } else {
          renderCompanyNames();
        }
      } catch (error) {
        companyFilter.title = error.message;
      }
    }

    function renderCompanyNames() {
      for (const row of ticketRowsContainer.querySelectorAll("tr")) {
        const companyCell = row.children[1];
        const name = companyCell?.querySelector(".secondary");
        if (name && row.dataset.companyId) name.textContent = companyNames.get(Number(row.dataset.companyId)) || "—";
      }
    }

    const requestedStatuses = searchParams.getAll("status");
    if (requestedStatuses.length) {
      const values = requestedStatuses.flatMap(value => value.toLowerCase().split(",").map(item => item.trim().replaceAll(" ", "")));
      statusFilters.forEach(filter => { filter.checked = values.includes(filter.value); });
    }
    updateStatusSelection();
    const requestedPriorities = searchParams.getAll("priority").flatMap(value => value.toLowerCase().split(","));
    priorityFilters.forEach(filter => {
      filter.checked = requestedPriorities.includes(filter.value);
    });
    updatePrioritySelection();
    const requestedAssignees = searchParams.getAll("assignees").flatMap(value => value.split(","));

    loadCompanyOptions();
    loadTickets();

    function filtersChanged() {
      currentPage = 0;
      updateStatusSelection();
      updatePrioritySelection();
      loadTickets();
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(filtersChanged, 300);
    });
    companyFilter.addEventListener("change", filtersChanged);
    statusFilters.forEach(filter => filter.addEventListener("change", filtersChanged));
    priorityFilters.forEach(filter => filter.addEventListener("change", filtersChanged));
    OmniEmployee.ready.then(() => {
      assigneeFilter = OmniEmployee.createAssigneeFilter({
        options: assigneeOptions,
        selection: assigneeSelection,
        requested: requestedAssignees,
        onChange: filtersChanged
      });
      if (assigneeFilter.values().length) filtersChanged();
    });
    previousPage.addEventListener("click", () => {
      if (currentPage > 0) {
        currentPage -= 1;
        loadTickets();
      }
    });
    nextPage.addEventListener("click", () => {
      currentPage += 1;
      loadTickets();
    });

    for (const dropdown of [statusDropdown, priorityDropdown, assigneeDropdown]) {
      document.addEventListener("click", event => {
        if (!dropdown.contains(event.target)) dropdown.open = false;
      });
      dropdown.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          dropdown.open = false;
          dropdown.querySelector("summary").focus();
        }
      });
    }
  </script>
</body>
</html>
