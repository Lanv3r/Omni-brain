<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Omnicommand IT operations workspace">
  <title>OmniCommand | Command Center</title>
  <style>
    :root { color-scheme: light; --bg: #f6f6f6; --panel: #ffffff; --line: #dedede; --text: #333333; --muted: #666666; --accent: #ffa500; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { border-bottom: 1px solid var(--line); background: #ffffff; }
    .bar, main { max-width: 1160px; margin: auto; padding-inline: clamp(18px, 5vw, 56px); }
    .bar { min-height: 75px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--text); font-size: 21px; font-weight: 750; letter-spacing: -.04em; text-decoration: none; }
    .partner-brand { display: block; width: auto; height: 48px; max-width: min(160px, 35vw); object-fit: contain; }
    .mark { display: block; flex: 0 0 auto; }
    .mark img { display: block; width: auto; height: 48px; object-fit: contain; }
    .section-nav { border-top: 1px solid var(--line); background: #fafafa; }
    .section-nav-inner { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); max-width: 1160px; margin: auto; padding-inline: clamp(18px, 5vw, 56px); }
    .section-nav a { padding: 12px 8px; color: var(--muted); font-size: 14px; font-weight: 650; text-align: center; text-decoration: none; }
    .section-nav a:hover, .section-nav a[aria-current="page"] { background: #fff3dc; color: var(--text); }
    .section-nav a[aria-current="page"] { box-shadow: inset 0 -2px var(--accent); }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
    main { padding-block: clamp(36px, 7vw, 78px); }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }
    h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.05; letter-spacing: -.055em; margin: 12px 0; }
    h3 { font-size: 16px; margin: 0; }
    p { color: var(--muted); margin: 0; }
    .intro { margin-bottom: 36px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr)); gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .metric { display: block; margin: 10px 0 6px; font-size: 29px; font-weight: 700; }
    .panel p { font-size: 14px; }
    .overview-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .summary-heading { display: flex; align-items: baseline; justify-content: center; gap: 12px; text-align: center; }
    .summary-heading a { color: var(--accent); text-decoration: none; }
    .summary-heading h3 { font-size: 19px; }
    .summary-heading p { font-size: 12px; }
    .summary-list { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }
    .summary-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; }
    .summary-item:hover { border-color: var(--accent); }
    .summary-item strong { font-size: 21px; }
    .summary-item span { font-size: 14px; }
    .summary-item.urgent, .summary-item.warning { border-color: #e2bd65; background: #fff9e9; color: #765000; }
    .summary-item.urgent:hover, .summary-item.warning:hover { border-color: #bd8100; }
    .summary-item.new-ticket { border-color: #a7d2b7; background: #eff8f2; color: #24633d; }
    .summary-item.new-ticket:hover { border-color: #43885b; }
    .summary-item.ticket-urgent, .summary-item.critical { border-color: #e5a5a1; background: #fff1f0; color: #a32922; }
    .summary-item.ticket-urgent:hover, .summary-item.critical:hover { border-color: #c43b33; }
    .summary-item.info { border-color: #a7c7e9; background: #eff6fd; color: #245b8e; }
    .summary-item.info:hover { border-color: #4d83bb; }
    @media (max-width: 760px) {
      .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .overview-grid { grid-template-columns: 1fr; }
      .section-nav-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="index.html" aria-label="OmniCommand home">
        <span class="mark" aria-hidden="true"><img src="assets/omnitechpro-fireball-transparent.png" alt=""></span>OmniCommand
      </a>
      <div class="current-employee" style="display:grid;gap:4px;margin-left:auto;min-width:180px"><label for="current-employee" style="font-size:12px">Current employee</label><select id="current-employee" style="min-height:36px;width:100%"><option value="">Loading employees...</option></select></div>
      <img class="partner-brand" src="assets/omnitechpro-logo.png" alt="OmniTechPro">
    </div>
    <nav class="section-nav" aria-label="Main navigation">
      <div class="section-nav-inner">
        <a href="tickets.html">Tickets</a>
        <a href="tasks.html">Tasks</a>
        <a href="my_assignments.html">My Assignments</a>
        <a href="process_plans.html">Process plans</a>
        <a href="alerts.html">Alerts</a>
        <a href="device_monitoring.html">Device monitoring</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="intro">
      <p class="eyebrow">IT Operations Workspace</p>
      <h1>Command Center</h1>
    </div>
    <section aria-label="Operations summary">
      <div class="grid overview-grid">
        <article class="panel">
          <div class="summary-heading">
            <h3><a href="tickets.html">Tickets</a></h3>
          </div>
          <div class="summary-list">
            <a class="summary-item new-ticket" href="tickets.html"><span>New</span><strong data-endpoint="new-tickets">—</strong></a>
            <a class="summary-item ticket-urgent" href="tickets.html?status=open&amp;priority=urgent"><span>Urgent</span><strong data-endpoint="urgent-tickets">—</strong></a>
            <a class="summary-item urgent" href="tickets.html?status=open&amp;priority=high"><span>High priority</span><strong data-endpoint="high-priority-tickets">—</strong></a>
            <a class="summary-item" href="tickets.html?status=open"><span>Open</span><strong data-endpoint="open-tickets">—</strong></a>
            <a class="summary-item" href="tickets.html?status=inprogress"><span>In progress</span><strong data-endpoint="in-progress-tickets">—</strong></a>
          </div>
        </article>
        <article class="panel">
          <div class="summary-heading">
            <h3><a href="tasks.html">Tasks</a></h3>
          </div>
          <div class="summary-list">
            <a class="summary-item" href="tasks.html?overdue=true"><span>Overdue</span><strong data-endpoint="overdue-tasks">—</strong></a>
            <a class="summary-item" href="tasks.html?status=pending"><span>Pending</span><strong data-endpoint="pending-tasks">—</strong></a>
            <a class="summary-item" href="tasks.html?status=inprogress"><span>In progress</span><strong data-endpoint="in-progress-tasks">—</strong></a>
          </div>
        </article>
        <article class="panel">
          <div class="summary-heading">
            <h3><a href="alerts.html?active=true">Alerts</a></h3>
          </div>
          <div class="summary-list">
            <a class="summary-item critical" href="alerts.html?active=true&amp;severity=critical"><span>Critical</span><strong data-endpoint="critical-alerts">—</strong></a>
            <a class="summary-item warning" href="alerts.html?active=true&amp;severity=warning"><span>Warning</span><strong data-endpoint="warning-alerts">—</strong></a>
            <a class="summary-item info" href="alerts.html?active=true&amp;severity=info"><span>Info</span><strong data-endpoint="info-alerts">—</strong></a>
          </div>
        </article>
        <article class="panel">
          <div class="summary-heading">
            <h3><a href="device_monitoring.html">Device monitoring</a></h3>
          </div>
          <div class="summary-list">
            <a class="summary-item" href="device_monitoring.html?online=true"><span>Online</span><strong data-endpoint="online-devices">—</strong></a>
            <a class="summary-item" href="device_monitoring.html?online=false"><span>Offline</span><strong data-endpoint="offline-devices">—</strong></a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <script src="assets/current_user.js?v=2"></script>
  <script>
    async function loadMetric(metric) {
      try {
        const response = await fetch(`http://127.0.0.1:8000/${metric.dataset.endpoint}`);
        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        metric.textContent = data.total;
      } catch (error) {
        metric.textContent = "Error";
        metric.title = error.message;
      }
    }
    document.querySelectorAll("[data-endpoint]").forEach(loadMetric);
  </script>
</body>
</html>
