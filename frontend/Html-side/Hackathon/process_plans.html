<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Omnicommand IT Operations Workspace">
  <title>OmniCommand | Operations Dashboard</title>
  <style>
    :root { color-scheme: light; --bg: #f6f6f6; --panel: #ffffff; --line: #dedede; --text: #333333; --muted: #666666; --accent: #ffa500; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { border-bottom: 1px solid var(--line); background: #ffffff; }
    .bar, main { max-width: 1160px; margin: auto; padding-inline: clamp(18px, 5vw, 56px); }
    .bar { min-height: 75px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-block: 14px; }
    .brand, .brand:visited { display: flex; align-items: center; gap: 12px; color: var(--text); font-size: 21px; font-weight: 750; letter-spacing: -.04em; text-decoration: none; }
    .mark { display: block; flex: 0 0 auto; }
    .mark img { display: block; width: auto; height: 48px; object-fit: contain; }
    .partner-brand { display: block; width: auto; height: 48px; max-width: min(160px, 35vw); object-fit: contain; }
    .section-nav { border-top: 1px solid var(--line); background: #fafafa; }
    .section-nav-inner { display: flex; max-width: 1160px; margin: auto; overflow-x: auto; padding-inline: clamp(18px, 5vw, 56px); }
    .section-nav a { flex: 1 0 auto; padding: 12px 8px; color: var(--muted); font-size: 14px; font-weight: 650; text-align: center; text-decoration: none; white-space: nowrap; }
    .section-nav a:hover, .section-nav a[aria-current="page"] { background: #fff3dc; color: var(--text); }
    .section-nav a[aria-current="page"] { box-shadow: inset 0 -2px var(--accent); }
    .badge { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
    main { padding-block: clamp(36px, 7vw, 78px); }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }
    h1 { font-size: clamp(34px, 6vw, 60px); line-height: 1.05; letter-spacing: -.055em; margin: 12px 0; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    h3 { font-size: 16px; margin: 0; }
    p { color: var(--muted); margin: 0; }
    .intro { margin-bottom: 36px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr)); gap: 14px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .metric { display: block; margin: 10px 0 6px; font-size: 29px; font-weight: 700; }
    .panel p { font-size: 14px; }
    .workspace { margin-top: 34px; }
    .workspace .grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
    .workspace h3 { margin-bottom: 6px; }
    @media (max-width: 520px) { .section-nav-inner { padding-inline: 16px; } }
  </style>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/theme.js"></script>
</head>
<body>
  <header>
    <div class="bar shell">
      <a class="brand" href="index.html" aria-label="OmniCommand home">
        <span class="mark" aria-hidden="true"><img src="assets/omnitechpro-fireball-transparent.png" alt=""></span>OmniCommand
      </a>
      <div class="header-tools">
        <div class="theme-menu">
          <button class="theme-toggle" type="button" aria-label="Choose color theme" aria-haspopup="menu" aria-expanded="false">
            <svg class="theme-icon" data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            <svg class="theme-icon" data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg>
            <svg class="theme-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"></path></svg>
          </button>
          <div class="theme-options" role="menu" hidden>
            <button class="theme-option" type="button" role="menuitem" data-theme-option="dark">
              <svg class="theme-icon" data-theme-icon="light" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
              <svg class="theme-icon" data-theme-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path></svg>
              <span>Dark mode</span>
            </button>
          </div>
        </div>
        <img class="partner-brand" src="assets/omnitechpro-logo.png" data-light-src="assets/omnitechpro-logo.png" data-dark-src="assets/omnitechpro-logo-dark.png" alt="OmniTechPro">
      </div>
    </div>
    <nav class="section-nav" aria-label="Main navigation">
      <div class="section-nav-inner shell">
        <a href="index.html">Command Center</a>
        <a href="tickets.html">Tickets</a>
        <a href="tasks.html">Tasks</a>
        <a href="alerts.html">Alerts</a>
        <a href="device_monitoring.html">Devices</a>
        <a href="knowledge_base.html">Knowledge Base</a>
      </div>
    </nav>
  </header>
</body>
</html>
